name: Issue Windows Obsidian acceptance (temporary)
on:
  push:
    branches: [fix/open-issues-97-121]
    paths: [.github/workflows/issue-native-windows.yml, scripts/obsidian-acceptance/issue-fresh-runtime.mjs]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'NAMEWTA/nand' && github.ref == 'refs/heads/fix/open-issues-97-121'
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: git diff --exit-code -- main.js
      - name: Extract pinned official Windows runtime into runner temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'Obsidian-1.13.7.exe'
          Invoke-WebRequest 'https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/Obsidian-1.13.7.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f233dc24896b3f2d5f9e4b01111181a561d0760b2105f0a474024c5f3143a9bc') { throw 'Official installer checksum mismatch' }
          $unpack = Join-Path $env:RUNNER_TEMP 'obsidian-installer'
          & 7z x $installer "-o$unpack" -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          $archive = @(Get-ChildItem $unpack -Recurse -Filter 'app-64.7z')
          if ($archive.Count -ne 1) { Get-ChildItem $unpack -Recurse | Select-Object FullName; throw 'Expected one x64 application archive' }
          $runtime = Join-Path $env:RUNNER_TEMP 'obsidian-runtime'
          & 7z x $archive[0].FullName "-o$runtime" -y
          if ($LASTEXITCODE -ne 0) { throw 'Application extraction failed' }
          $exe = Join-Path $runtime 'Obsidian.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw 'Runtime executable missing' }
          "NAND_OBSIDIAN_EXECUTABLE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NAND_FRESH_FIXTURE_ROOT=$(Join-Path $env:RUNNER_TEMP 'nand-r21-native')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Ten native comment reloads and twelve deferred views across a full app restart
        env:
          NAND_ALLOW_FRESH_ISSUE_FIXTURE: '1'
        run: node scripts/obsidian-acceptance/issue-fresh-runtime.mjs
      - name: Preserve the exact source and actual native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-native-windows-evidence
          path: ${{ runner.temp }}/nand-r21-native/evidence
          retention-days: 30
