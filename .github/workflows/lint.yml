name: Node.js build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run lint
            - run: pnpm run test:architecture
            - run: pnpm run test:automation
            - run: pnpm run test:safety-regressions
            - run: pnpm run test:terminal-agent
            - run: pnpm run test:contacts
            - run: pnpm run test:iconic-port
            - run: pnpm run test:editor-comments
            - run: pnpm run test:panel-composition
            - run: pnpm run test:dashboard-isolation
            - run: pnpm run test:card-panels

    windows-portability:
        runs-on: windows-latest
        env:
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: core.autocrlf
            GIT_CONFIG_VALUE_0: "true"
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - name: Use Node.js 24
              uses: actions/setup-node@v5
              with:
                  node-version: 24.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run lint
            - run: pnpm run test:automation
            - run: pnpm run test:safety-regressions
            - run: pnpm run test:contacts
            - run: pnpm run test:iconic-port
