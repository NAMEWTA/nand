# Refresh the exact final candidate for local verification; remove this workflow before merge.
name: Issue isolated devkit (temporary)
on:
  push:
    branches: [fix/open-issues-97-121]
    paths: [.github/workflows/issue-devkit.yml]
permissions:
  contents: read
jobs:
  devkit:
    if: github.repository == 'NAMEWTA/nand' && github.ref == 'refs/heads/fix/open-issues-97-121'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package source and dependencies without credentials or Git configuration
        run: |
          mkdir -p "$RUNNER_TEMP/nand-devkit"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/nand-devkit"
          cp -a node_modules "$RUNNER_TEMP/nand-devkit/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/nand-devkit/SOURCE_COMMIT"
          tar -czf "$RUNNER_TEMP/nand-devkit.tar.gz" -C "$RUNNER_TEMP/nand-devkit" .
      - uses: actions/upload-artifact@v4
        with:
          name: issue-source-devkit
          path: ${{ runner.temp }}/nand-devkit.tar.gz
          compression-level: 0
          retention-days: 3
