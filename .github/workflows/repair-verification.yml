name: Repair verification

on:
  push:
    branches: ['fix/open-issues-20261003']
    paths: ['.github/workflows/repair-verification.yml']

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - run: pnpm install --frozen-lockfile
      - name: Export source and installed public dependencies without credentials
        run: |
          git rev-parse HEAD > WORKSPACE_SOURCE_SHA
          tar --exclude='./.git' --exclude='./processes/rust-terminal-servers/binaries' --exclude='./workspace.tar.gz' -czf "$RUNNER_TEMP/workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: repair-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/workspace.tar.gz
          retention-days: 1
