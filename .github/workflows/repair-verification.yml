name: Repair verification

on:
  push:
    branches: ['fix/open-issues-20261003']

permissions:
  contents: read

concurrency:
  group: repair-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    if: github.event.head_commit.message == 'Prepare native acceptance fixture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - name: Download official desktop test runtime
        shell: bash
        run: |
          mkdir fixture
          cp "$(command -v node)" fixture/node
          curl --fail --location --retry 2 https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/Obsidian-1.13.7.AppImage -o fixture/Obsidian.AppImage
          echo 'e0d8e0a611624de8c9c7dcd8a9e648279fb0a0d552faa1312b7e4f3a5fa72663  fixture/Obsidian.AppImage' | sha256sum --check
          curl --fail --location --retry 2 https://github.com/NAMEWTA/nand/releases/download/0.0.1-alpha1/rust-terminal-servers-linux-x64 -o fixture/rust-terminal-servers-linux-x64
          curl --fail --location --retry 2 https://github.com/NAMEWTA/nand/releases/download/0.0.1-alpha1/rust-terminal-servers-linux-x64.sha256 -o fixture/rust-terminal-servers-linux-x64.sha256
          (cd fixture && sha256sum --check rust-terminal-servers-linux-x64.sha256)
          chmod +x fixture/node fixture/Obsidian.AppImage fixture/rust-terminal-servers-linux-x64
          tar -czf native-fixture.tar.gz fixture
      - uses: actions/upload-artifact@v4
        with:
          name: repair-native-fixture
          path: native-fixture.tar.gz
          compression-level: 0
          retention-days: 3
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Retain offline source and frozen dependencies
        shell: bash
        run: |
          tar --exclude=./.git --exclude=./repair-evidence -czf "$RUNNER_TEMP/nand-workspace.tar.gz" .
          mkdir -p repair-evidence
          cp "$RUNNER_TEMP/nand-workspace.tar.gz" repair-evidence/workspace.tar.gz
      - name: Build and test the source candidate
        shell: bash
        run: |
          mkdir -p repair-evidence
          set +e
          pnpm run build > repair-evidence/build.log 2>&1
          build=$?
          pnpm run lint > repair-evidence/lint.log 2>&1
          lint=$?
          pnpm run test:all > repair-evidence/tests.log 2>&1
          tests=$?
          printf 'build=%s\nlint=%s\ntests=%s\n' "$build" "$lint" "$tests" | tee repair-evidence/results.txt
          git rev-parse HEAD > repair-evidence/source-sha.txt
          cp main.js repair-evidence/main.js
          sha256sum main.js > repair-evidence/main.sha256
          test "$build" -eq 0 && test "$lint" -eq 0 && test "$tests" -eq 0
      - name: Retain diagnostic logs and candidate bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-evidence-${{ github.sha }}
          path: repair-evidence/
          retention-days: 7
