name: Repair verification

on:
  push:
    branches: ['fix/open-issues-20261003']
    paths: ['.github/workflows/repair-verification.yml']

permissions:
  contents: read

jobs:
  desktop-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Download public test runtimes and verify release checksums
        run: |
          mkdir runtime
          cd runtime
          curl --fail --location --retry 3 -o Obsidian.AppImage https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/Obsidian-1.13.7.AppImage
          echo 'e0d8e0a611624de8c9c7dcd8a9e648279fb0a0d552faa1312b7e4f3a5fa72663  Obsidian.AppImage' | sha256sum -c -
          curl --fail --location --retry 3 -O https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
          curl --fail --location --retry 3 -o node-checksums.txt https://nodejs.org/dist/v24.21.0/SHASUMS256.txt
          grep ' node-v24.21.0-linux-x64.tar.xz$' node-checksums.txt | sha256sum -c -
          curl --fail --location --retry 3 -O https://github.com/NAMEWTA/nand/releases/download/0.0.1-alpha1/rust-terminal-servers-linux-x64
          curl --fail --location --retry 3 -O https://github.com/NAMEWTA/nand/releases/download/0.0.1-alpha1/rust-terminal-servers-linux-x64.sha256
          sha256sum -c rust-terminal-servers-linux-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: repair-desktop-runtimes-${{ github.sha }}
          path: runtime/
          retention-days: 1
