name: Workbench implementation build
# Temporary implementation harness; remove before final review.
on:
  push:
    branches: [refactor/unified-workbench-v2]
    paths: [scripts/workbench-stage.mjs]
permissions:
  contents: write
concurrency:
  group: workbench-implementation
  cancel-in-progress: false
jobs:
  implement:
    if: github.ref == 'refs/heads/refactor/unified-workbench-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the hash-verified implementation stage
        run: node scripts/workbench-stage.mjs
      - run: pnpm run build
      - name: Verify build identity
        run: node scripts/workbench-stage.mjs --verify-build
      - run: pnpm run lint
      - run: pnpm run test:all
      - name: Commit verified source and build to this branch only
        env:
          IMPLEMENTATION_BRANCH: refactor/unified-workbench-v2
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote_head=$(git ls-remote origin "refs/heads/$IMPLEMENTATION_BRANCH" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git add src scripts docs speculo .agents styles.css main.js package.json esbuild.config.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: verify workbench lifecycle, shared Agent navigation and native compatibility'
            git push origin "HEAD:refs/heads/$IMPLEMENTATION_BRANCH"
          fi
          git rev-parse HEAD > implementation-source-sha.txt
          sha256sum main.js styles.css manifest.json > implementation-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nand-workbench-verified-stage
          path: |
            implementation-source-sha.txt
            implementation-SHA256SUMS
            main.js
            styles.css
            manifest.json
          retention-days: 7
