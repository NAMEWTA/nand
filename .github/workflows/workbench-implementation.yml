name: Workbench implementation build

# Temporary implementation harness; remove before final review.
# Only this branch is writable. No releases, tags or external credentials.
on:
  push:
    branches: [refactor/unified-workbench-v2]
    paths: [scripts/workbench-stage.mjs]
permissions:
  contents: write
concurrency:
  group: workbench-implementation
  cancel-in-progress: false
jobs:
  implement:
    if: github.ref == 'refs/heads/refactor/unified-workbench-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the reviewed implementation stage
        run: node scripts/workbench-stage.mjs
      - run: pnpm run build
        id: build
      - name: Commit built implementation to this branch only
        env:
          IMPLEMENTATION_BRANCH: refactor/unified-workbench-v2
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote_head=$(git ls-remote origin "refs/heads/$IMPLEMENTATION_BRANCH" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git add src scripts docs speculo .agents styles.css main.js package.json esbuild.config.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Implement and build the reviewed workbench stage'
            git push origin "HEAD:refs/heads/$IMPLEMENTATION_BRANCH"
          fi
      - run: pnpm run lint
      - name: Run all existing and new tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run test:all
