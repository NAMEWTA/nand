name: Workbench implementation build
# Temporary branch-only harness; remove before final review.
on:
  push:
    branches: [refactor/unified-workbench-v2]
    paths: [scripts/workbench-stage.mjs]
permissions:
  contents: write
concurrency:
  group: workbench-implementation
  cancel-in-progress: false
jobs:
  implement:
    if: github.ref == 'refs/heads/refactor/unified-workbench-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the reviewed implementation stage
        run: node scripts/workbench-stage.mjs
      - name: Prepare isolated validation bundle
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/nand-tools/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/nand-tools/bin/node"
          cp -R "$(dirname "$(readlink -f "$(command -v pnpm)")")/.." "$RUNNER_TEMP/nand-tools/pnpm"
          tar -czf "$RUNNER_TEMP/nand-source.tgz" --exclude=.git --exclude=scripts/tmp --exclude=node_modules/.tmp --exclude=.git-credentials .
          tar -czf "$RUNNER_TEMP/nand-tools.tgz" -C "$RUNNER_TEMP/nand-tools" .
      - uses: actions/upload-artifact@v4
        with:
          name: nand-workbench-validation-source
          path: |
            ${{ runner.temp }}/nand-source.tgz
            ${{ runner.temp }}/nand-tools.tgz
          compression-level: 0
          retention-days: 3
      - run: pnpm run build
        id: build
      - name: Commit built implementation to this branch only
        env:
          IMPLEMENTATION_BRANCH: refactor/unified-workbench-v2
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote_head=$(git ls-remote origin "refs/heads/$IMPLEMENTATION_BRANCH" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git add src scripts docs speculo .agents styles.css main.js package.json esbuild.config.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Implement and build the reviewed workbench stage'
            git push origin "HEAD:refs/heads/$IMPLEMENTATION_BRANCH"
          fi
      - run: pnpm run lint
      - name: Run all existing and new tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run test:all
