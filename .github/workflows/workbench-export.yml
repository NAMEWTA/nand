name: Workbench isolated source export
# Temporary read-only handoff for PR completion; removed before final review.
on:
  push:
    branches: [refactor/unified-workbench-v2]
    paths: [.github/workflows/workbench-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export tracked source and reproducible build dependencies
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/nand-export"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/nand-export/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/nand-export/source-sha.txt"
          tar -czf "$RUNNER_TEMP/nand-export/node_modules.tar.gz" node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/nand-export/node"
          node --version > "$RUNNER_TEMP/nand-export/node-version.txt"
          pnpm --version > "$RUNNER_TEMP/nand-export/pnpm-version.txt"
          cp pnpm-lock.yaml "$RUNNER_TEMP/nand-export/"
          cd "$RUNNER_TEMP/nand-export"
          sha256sum source.tar.gz node_modules.tar.gz node pnpm-lock.yaml > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nand-workbench-source-dependencies
          path: ${{ runner.temp }}/nand-export/
          retention-days: 3
