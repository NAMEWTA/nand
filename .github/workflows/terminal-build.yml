name: Build terminal servers

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['processes/rust-terminal-servers/**', 'scripts/verify-pty-windows.mjs', '.github/workflows/terminal-build.yml']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: linux-x64, ext: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64, ext: '' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: darwin-x64, ext: '' }
          - { os: macos-15, target: aarch64-apple-darwin, asset: darwin-arm64, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: win32-x64, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test and build
        shell: bash
        env:
          TERMINAL_SERVER_VERSION: ${{ github.ref_name }}
        run: |
          cargo test --locked --manifest-path processes/rust-terminal-servers/Cargo.toml --target '${{ matrix.target }}'
          cargo build --locked --release --manifest-path processes/rust-terminal-servers/Cargo.toml --target '${{ matrix.target }}'
      - name: Set up Node for Windows integration
        if: matrix.asset == 'win32-x64'
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - name: Exercise Windows PTY lifecycle and history
        if: matrix.asset == 'win32-x64'
        run: node scripts/verify-pty-windows.mjs processes/rust-terminal-servers/target/${{ matrix.target }}/release/rust-terminal-servers.exe
      - name: Package binary and checksum
        shell: python
        run: |
          import hashlib, pathlib, shutil
          name = 'rust-terminal-servers-${{ matrix.asset }}${{ matrix.ext }}'
          source = pathlib.Path('processes/rust-terminal-servers/target/${{ matrix.target }}/release/rust-terminal-servers${{ matrix.ext }}')
          output = pathlib.Path('terminal-artifacts')
          output.mkdir()
          target = output / name
          shutil.copy2(source, target)
          (output / (name + '.sha256')).write_text(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + name + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.asset }}
          path: terminal-artifacts/*
