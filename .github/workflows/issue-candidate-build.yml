name: Issue candidate build (temporary)
on:
  push:
    branches: [fix/open-issues-97-121]
    paths: [.github/workflows/issue-candidate-build.yml, scripts/issue-candidate-patch.mjs, scripts/issue-candidate-preflight.mjs, src/**, styles.css, scripts/verify-issue-repairs.ts]
permissions:
  contents: write
concurrency:
  group: issue-candidate-build
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'NAMEWTA/nand' && github.ref == 'refs/heads/fix/open-issues-97-121'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact candidate patch
        run: |
          if test -f scripts/issue-candidate-preflight.mjs; then
            node scripts/issue-candidate-preflight.mjs
            rm scripts/issue-candidate-preflight.mjs
          fi
          if test -f scripts/issue-candidate-patch.mjs; then
            node scripts/issue-candidate-patch.mjs
            rm scripts/issue-candidate-patch.mjs
          fi
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:all
      - name: Commit only the candidate source and matching bundle
        run: |
          test "$GITHUB_REF" = refs/heads/fix/open-issues-97-121
          git config user.name 'NAND issue repair'
          git config user.email '67400687+NAMEWTA@users.noreply.github.com'
          git add -- src scripts main.js styles.css speculo .agents
          if ! git diff --cached --quiet; then
            git commit -m 'Fix dashboard issue regressions and rebuild verified production bundle'
            git push origin HEAD:refs/heads/fix/open-issues-97-121
          fi
