name: Workbench native PTY fixture
# Temporary read-only native validation preparation; removed before final review.
on:
  push:
    branches: [refactor/unified-workbench-v2]
    paths: [.github/workflows/workbench-pty-build.yml]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test native process and history contracts
        run: cargo test --locked --manifest-path processes/rust-terminal-servers/Cargo.toml
      - name: Build the matching native fixture
        run: cargo build --locked --release --manifest-path processes/rust-terminal-servers/Cargo.toml
      - name: Export native source identity
        shell: bash
        run: git rev-parse HEAD > native-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-native-pty-${{ matrix.os }}
          path: |
            processes/rust-terminal-servers/target/release/rust-terminal-servers*
            native-source-sha.txt
          retention-days: 7
