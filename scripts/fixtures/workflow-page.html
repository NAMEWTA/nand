<!doctype html><html><head><meta charset="utf-8"><title>Controlled workflow form</title>
<style>body{font:16px system-ui;margin:32px}label{display:block;margin:20px 0}textarea{display:block;width:80%;height:100px}button{min-height:40px;padding:8px 24px}</style></head>
<body><h1>Controlled workflow form</h1><form action="https://workflow.example.test/form/submit" method="post">
<label>Message<textarea id="message" name="message" aria-label="Message"></textarea></label>
<button id="submit" type="submit">Apply</button></form>
<label>Result<textarea id="result" aria-label="Result" readonly></textarea></label><p id="count">0</p>
<script>window.workflowSubmissions=0;document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();workflowSubmissions++;document.querySelector('#result').value=document.querySelector('#message').value;document.querySelector('#count').textContent=String(workflowSubmissions)});window.resetWorkflow=()=>{document.querySelector('#message').value='';document.querySelector('#result').value='';return true};</script></body></html>
